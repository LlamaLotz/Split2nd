<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" style="color:#F1F5F0;--badge-bg:#111513;--badge-star:#6EE7FF">
  <title id="title">Split2nd star badge</title>
  <desc id="desc">A star medal for a standout rep.</desc>
  <style>
    .rim { fill: var(--badge-bg, #111513); stroke: currentColor; stroke-width: 3; }
    .track { fill: none; stroke: currentColor; stroke-width: 2; opacity: .28; }
    .star { fill: var(--badge-star, #6EE7FF); stroke: #080A09; stroke-width: 3; stroke-linejoin: round; }
    .core { fill: var(--badge-bg, #111513); opacity: .35; }
    .tick { stroke: currentColor; stroke-width: 3; stroke-linecap: round; opacity: .55; }
  </style>
  <circle class="rim" cx="64" cy="64" r="54"/>
  <circle class="track" cx="64" cy="64" r="45" stroke-dasharray="2 8"/>

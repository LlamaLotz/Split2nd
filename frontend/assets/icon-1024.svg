<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Split2nd app icon</title>
  <desc id="desc">The Split2nd boxing glove mascot on an ink-black tile with a signal-green glow.</desc>
  <defs>
    <radialGradient id="halo" cx="26%" cy="18%" r="85%">
      <stop offset="0" stop-color="#3DFFA2" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#3DFFA2" stop-opacity=".04"/>
      <stop offset="1" stop-color="#080A09" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <style>
      .body { fill: #3DFFA2; stroke: #080A09; stroke-width: 18; stroke-linejoin: round; }
      .ink { fill: #080A09; }
      .eye { fill: #F1F5F0; stroke: #080A09; stroke-width: 15; }
      .pupil { fill: #080A09; }
      .glint { fill: #F1F5F0; }
      .line { fill: none; stroke: #080A09; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .seam { fill: none; stroke: #080A09; stroke-width: 15; stroke-linecap: round; opacity: .35; }
      .mark { fill: none; stroke: #F1F5F0; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .grid { fill: none; stroke: #2A322C; stroke-width: 2; opacity: .55; }
    </style>
  </defs>

  <rect width="1024" height="1024" fill="#080A09"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g class="grid">
    <path d="M0 256 H1024 M0 512 H1024 M0 768 H1024"/>
    <path d="M256 0 V1024 M512 0 V1024 M768 0 V1024"/>

  <circle cx="512" cy="500" r="372" fill="none" stroke="#3DFFA2" stroke-width="3" opacity=".28"/>
  <ellipse cx="512" cy="520" rx="290" ry="276" fill="#3DFFA2" opacity=".16" filter="url(#soft)"/>

  <g transform="translate(128 104) scale(3)">

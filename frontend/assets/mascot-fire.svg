<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" style="color:#F1F5F0;--mascot-body:#3DFFA2;--mascot-ink:#080A09;--mascot-glow:#FFC857;--mascot-flame:#FFC857;--mascot-flame-hot:#FF5B5B">
  <title id="title">Split2nd glove mascot, fire</title>
  <desc id="desc">The Split2nd boxing glove mascot fired up with a determined face, gritted teeth and flames.</desc>
  <defs>
    <filter id="soft-fire" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <style>
    .glow { fill: var(--mascot-glow, #FFC857); opacity: .4; filter: url(#soft-fire); }
    .body { fill: var(--mascot-body, #3DFFA2); stroke: var(--mascot-ink, #080A09); stroke-width: 6; stroke-linejoin: round; }
    .ink { fill: var(--mascot-ink, #080A09); }
    .eye { fill: currentColor; stroke: var(--mascot-ink, #080A09); stroke-width: 5; stroke-linejoin: round; }
    .pupil { fill: var(--mascot-ink, #080A09); }
    .glint { fill: currentColor; }
    .line { fill: none; stroke: var(--mascot-ink, #080A09); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .seam { fill: none; stroke: var(--mascot-ink, #080A09); stroke-width: 5; stroke-linecap: round; opacity: .35; }
    .mark { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .flame { fill: var(--mascot-flame, #FFC857); stroke: var(--mascot-ink, #080A09); stroke-width: 5; stroke-linejoin: round; }
    .flame-hot { fill: var(--mascot-flame-hot, #FF5B5B); stroke: var(--mascot-ink, #080A09); stroke-width: 5; stroke-linejoin: round; }
    .tooth { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; }
  </style>

  <ellipse class="glow" cx="128" cy="128" rx="116" ry="112"/>

  <!-- flames behind the glove -->
  <path class="flame" d="M68 164 C42 144 44 108 68 86 C62 110 78 118 76 138 C75 151 72 159 68 164 Z"/>
  <path class="flame-hot" d="M188 166 C216 146 214 110 190 88 C196 112 180 120 182 140 C183 153 186 161 188 166 Z"/>
  <path class="flame" d="M125 37 C113 53 121 64 135 68 C118 72 108 62 109 51 C110 42 118 38 125 37 Z"/>
  <path class="flame-hot" d="M83 74 C70 62 74 44 90 37 C85 50 94 55 93 64 C92 70 88 73 83 74 Z"/>

  <!-- thumb + fist -->
  <path class="body" d="M84 178 C72 162 68 140 72 118 C76 88 92 60 120 46 C148 32 180 38 198 60 C214 80 216 108 208 132 C199 158 180 174 156 180 Z"/>
  <path class="body" d="M78 128 C62 126 50 136 50 151 C50 166 62 177 78 176 C89 176 97 170 101 160 L101 139 C95 132 87 128 78 128 Z"/>
  <path class="seam" d="M100 139 C96 150 95 162 98 174"/>
  <path class="seam" d="M180 65 C192 77 198 91 200 106"/>
  <path class="seam" d="M168 58 C181 70 189 85 192 102"/>

  <!-- determined face -->
  <path class="line" d="M102 78 L141 87"/>
  <path class="line" d="M190 78 L151 87"/>
  <path class="eye" d="M105 92 L141 85 L141 101 L105 104 Z"/>
  <circle class="pupil" cx="126" cy="95" r="7"/>
  <circle class="glint" cx="130" cy="91" r="2.5"/>
  <path class="eye" d="M151 85 L189 92 L189 104 L151 101 Z"/>
  <circle class="pupil" cx="173" cy="95" r="7"/>
  <circle class="glint" cx="177" cy="91" r="2.5"/>
  <rect class="ink" x="126" y="121" width="48" height="23" rx="9"/>
  <path class="tooth" d="M127 132 H173 M139 123 V143 M151 123 V143 M163 123 V143"/>

  <!-- steam -->
  <path class="flame" d="M208 52 C218 44 230 46 236 54 C228 54 222 58 218 64 C214 60 211 56 208 52 Z" opacity=".9"/>

  <!-- cuff + S2 -->
  <rect class="ink" x="80" y="172" width="96" height="56" rx="16"/>
  <path class="mark" d="M109 192 C102 192 98 195 98 200 C98 205 103 207 109 208 C115 209 117 212 117 216 C117 221 112 223 105 222"/>
  <path class="mark" d="M124 193 H141 C145 193 147 196 147 200 C147 204 143 208 137 212 L124 222 H147"/>
</svg>

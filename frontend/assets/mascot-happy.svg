<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" style="color:#F1F5F0;--mascot-body:#3DFFA2;--mascot-ink:#080A09;--mascot-glow:#3DFFA2;--mascot-spark:#FFC857">
  <title id="title">Split2nd glove mascot, happy</title>
  <desc id="desc">The Split2nd boxing glove mascot grinning after a clean rep, with amber sparkles.</desc>
  <defs>
    <filter id="soft-happy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <style>
    .glow { fill: var(--mascot-glow, #3DFFA2); opacity: .28; filter: url(#soft-happy); }
    .body { fill: var(--mascot-body, #3DFFA2); stroke: var(--mascot-ink, #080A09); stroke-width: 6; stroke-linejoin: round; }
    .ink { fill: var(--mascot-ink, #080A09); }
    .eye { fill: currentColor; stroke: var(--mascot-ink, #080A09); stroke-width: 5; }
    .pupil { fill: var(--mascot-ink, #080A09); }
    .glint { fill: currentColor; }
    .line { fill: none; stroke: var(--mascot-ink, #080A09); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .seam { fill: none; stroke: var(--mascot-ink, #080A09); stroke-width: 5; stroke-linecap: round; opacity: .35; }
    .mark { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .spark { fill: none; stroke: var(--mascot-spark, #FFC857); stroke-width: 6; stroke-linecap: round; }
  </style>

  <ellipse class="glow" cx="128" cy="120" rx="112" ry="110"/>
  <g class="spark">
    <path d="M47 70 V92 M36 81 H58"/>
    <path d="M211 152 V170 M202 161 H220"/>
    <path d="M208 42 V54 M202 48 H214"/>
  </g>

  <!-- thumb + fist -->
  <path class="body" d="M84 178 C72 162 68 140 72 118 C76 88 92 60 120 46 C148 32 180 38 198 60 C214 80 216 108 208 132 C199 158 180 174 156 180 Z"/>
  <path class="body" d="M78 128 C62 126 50 136 50 151 C50 166 62 177 78 176 C89 176 97 170 101 160 L101 139 C95 132 87 128 78 128 Z"/>
  <path class="seam" d="M100 139 C96 150 95 162 98 174"/>
  <path class="seam" d="M180 65 C192 77 198 91 200 106"/>
  <path class="seam" d="M168 58 C181 70 189 85 192 102"/>

  <!-- happy face -->
  <path class="line" d="M103 76 Q122 68 141 77"/>
  <path class="line" d="M153 77 Q172 68 191 76"/>
  <ellipse class="eye" cx="122" cy="98" rx="17" ry="19"/>
  <circle class="pupil" cx="126" cy="100" r="8"/>
  <circle class="glint" cx="131" cy="94" r="3"/>
  <ellipse class="eye" cx="170" cy="95" rx="17" ry="19"/>
  <circle class="pupil" cx="174" cy="97" r="8"/>
  <circle class="glint" cx="179" cy="91" r="3"/>
  <path class="line" d="M126 124 Q150 158 176 123"/>
  <path class="line" d="M104 126 Q112 132 121 129" opacity=".5"/>
  <path class="line" d="M181 126 Q190 132 198 128" opacity=".5"/>

  <!-- cuff + S2 -->
  <rect class="ink" x="80" y="172" width="96" height="56" rx="16"/>
  <path class="mark" d="M109 192 C102 192 98 195 98 200 C98 205 103 207 109 208 C115 209 117 212 117 216 C117 221 112 223 105 222"/>
  <path class="mark" d="M124 193 H141 C145 193 147 196 147 200 C147 204 143 208 137 212 L124 222 H147"/>
</svg>
